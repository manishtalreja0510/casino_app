name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The local-first stack (ADR-021) as CI service containers: same engines, same ports,
    # no cloud resources. Integration tests run against a real PostgreSQL and Redis —
    # money and audit paths are never tested against a mock (testing-strategy.md).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casino_dev
          POSTGRES_USER: casino_dev
          POSTGRES_PASSWORD: casino_dev_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casino_dev -d casino_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://casino_dev:casino_dev_local_only@127.0.0.1:5432/casino_dev
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Database migrations
        run: pnpm --filter @casino/api migrate

      - name: Integration tests (real PostgreSQL + Redis)
        run: pnpm --filter @casino/api test:int

  secret-scan:
    name: Secret scanning (rule 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (high severity and above)
        run: pnpm audit --audit-level high
