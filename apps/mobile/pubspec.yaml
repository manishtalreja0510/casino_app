name: casino_app
description: Real-time gaming platform client (Android first, off-store).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  connectivity_plus: ^6.1.0
  flutter_secure_storage: ^9.2.2
  ui_kit:
    path: packages/ui_kit
  app_assets:
    path: packages/assets
  api_client:
    path: packages/api_client

dev_dependencies:
  # Test-only: the widget tests stub the HTTP layer to prove the client talks to the URLs
  # it claims to. Not used by app code — `api_client` owns the transport.
  http: ^1.2.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
